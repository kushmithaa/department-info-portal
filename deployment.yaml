apiVersion: apps/v1
kind: Deployment
metadata:
  name: department-info-portal
spec:
  replicas: 3
  selector:
    matchLabels:
      app: department-info-portal
  template:
    metadata:
      labels:
        app: department-info-portal
    spec:
      containers:
      - name: department-info-portal
        image: kushmithaa/department-info-portal:latest
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: department-info-service
spec:
  type: NodePort
  selector:
    app: department-info-portal
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30012
